    <script>
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function (battery) {
                function updateBatteryStatus() {
                    const batteryLevel = Math.round(battery.level * 100);
                    const batteryInfo = document.getElementById('battery-info');
                    let message = `Remaining Battery: ${batteryLevel}%`;
                    if (battery.charging) {
                        message += ', Charging';
                    }
                    if (batteryLevel < 20) {
                        message += '. Remember to charge your device.';
                    }
                    batteryInfo.textContent = message;
                }
                updateBatteryStatus();
                battery.addEventListener('levelchange', updateBatteryStatus);
                battery.addEventListener('chargingchange', updateBatteryStatus);
            }).catch(function (error) {
                const batteryInfo = document.getElementById('battery-info');
                batteryInfo.textContent = `Failed to get battery information: ${error.message}`;
            });
        } else {
            const batteryInfo = document.getElementById('battery-info');
            batteryInfo.textContent = 'This browser does not support the battery information API';
        }
    </script>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speed = Math.random() * 6 + 6;
                this.alpha = Math.random();
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = Math.random() * -canvas.height;
                    this.x = Math.random() * canvas.width;
                    this.alpha = Math.random();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'white';
                ctx.fill();
            }
        }

        const particles = [];
        const numParticles = 200;

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
