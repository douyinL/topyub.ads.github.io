<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <title>Slider Verification</title>
    <style>
        .verification-container {
            width: 300px;
            margin: 0 auto;
            background-color: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .slider {
            width: 40px;
            height: 40px;
            background-color: #1e90ff;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: left 0.3s ease;
        }

        .slider::before {
            content: '\f047';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
        }

        .slider-track {
            height: 40px;
            background-color: #e0e0e0;
        }

        .success {
            background-color: #2ecc71;
        }

        .error {
            background-color: #e74c3c;
        }

        .info-text {
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h2 class="text-2xl font-bold mb-4">Slider Verification</h2>
        <div class="info-text" id="infoText">Please drag the slider to complete the verification</div>
        <div class="verification-container">
            <div class="slider-track"></div>
            <div class="slider" id="slider"></div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const infoText = document.getElementById('infoText');
        const verificationContainer = document.querySelector('.verification-container');
        const targetPosition = verificationContainer.offsetWidth - slider.offsetWidth;

        let isDragging = false;
        let startX;
        let currentX = 0;

        slider.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            slider.style.transition = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startX;
                currentX += deltaX;
                startX = e.clientX;

                if (currentX < 0) {
                    currentX = 0;
                } else if (currentX > targetPosition) {
                    currentX = targetPosition;
                }

                slider.style.left = currentX + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                slider.style.transition = 'left 0.3s ease';

                if (currentX >= targetPosition - 5) {
                    slider.classList.add('success');
                    infoText.textContent = 'Verification passed, redirecting...';
                    infoText.classList.add('text-green-500');
                    setTimeout(() => {
                        window.location.href = 'Home.html';
                    }, 500);
                } else {
                    slider.classList.add('error');
                    infoText.textContent = 'Verification failed, redirecting...';
                    infoText.classList.add('text-red-500');
                    setTimeout(() => {
                        window.location.href = 'fail.html';
                    }, 500);
                }
            }
        });
    </script>
</body>

</html>
